services:
  backend:
    build: ./backend/api
    container_name: keyly-springboot
    ports:
      - "${SPRINGBOOT_PORT_LOCAL}:${SPRINGBOOT_PORT_DOCKER}"
    networks:
      - network
    volumes:
      - uploads:/app/uploads

  db:
    image: mysql:8.0
    container_name: keyly-mysql
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      LANG: C.UTF-8
    ports:
      - "${MYSQL_PORT_LOCAL}:${MYSQL_PORT_DOCKER}"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/mysql-init:/docker-entrypoint-initdb.d
    networks:
      - network
    command: 
      --character-set-server=utf8mb4
  
  cassandra:
    image: cassandra:5.0.8
    container_name: keyly-cassandra
    ports:
      - "${CASSANDRA_PORT_LOCAL}:${CASSANDRA_PORT_DOCKER}"
    environment:
      - MAX_HEAP_SIZE=1G
      - HEAP_NEWSIZE=256M
      - CASSANDRA_USER=${CASSANDRA_USER}
      - CASSANDRA_PASSWORD=${CASSANDRA_PASSWORD}
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks:
      - network

  nginx:
    build: 
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: keyly-nginx
    ports:
      - "${NGINX_PORT_LOCAL}:${NGINX_PORT_DOCKER}"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./documentation/site:/usr/share/nginx/html/docs:ro
    networks:
      - network

volumes:
  mysql-data:
  cassandra-data:
  uploads:

networks:
  network:
    driver: bridge