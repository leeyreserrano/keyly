      - Cómo usar la app: usuario/como-usar.md
      - Funcionalidades: usuario/funcionalidades.md
      - FAQ: usuario/faq.md

  - 🎓 Documentación Técnica:
      - Introducción: profesor/introduccion.md
      - Arquitectura: profesor/arquitectura.md
      - Base de datos: profesor/base-datos.md
      - API: profesor/api.md
      - Decisiones técnicas: profesor/decisiones-tecnicas.md

  - 🛠️ Desarrollo:
      - Roadmap: desarrollo/roadmap.md
      - Issues: desarrollo/issues.md
      - Cambios: desarrollo/cambios.md

extra_css:
  - styles/extra.css

plugins:
  - search